      // ============================================================
      // WEEKLY REPORT
      // ============================================================
      function generateWeeklyReport() {
        const entries = getEntries();
        const container = document.getElementById('reportContent');
        if (!container) return;

        if (entries.length === 0) {
          container.innerHTML =
            '<div class="empty-state" style="padding:30px 20px;">' +
              '<i class="far fa-calendar-alt"></i>' +
              '<p>Add some transactions to see your weekly report</p>' +
            '</div>';
          return;
        }

        const days = getLastNDays(7);
        const startDate = days[0];
        const endDate = days[days.length - 1];
        const filtered = entries.filter(e => e.date >= startDate && e.date <= endDate);

        if (filtered.length === 0) {
          container.innerHTML =
            '<div class="empty-state" style="padding:30px 20px;">' +
              '<i class="far fa-calendar-alt"></i>' +
              '<p>No transactions in the last 7 days</p>' +
            '</div>';
          return;
        }

        let totalInc = 0, totalExp = 0;
        const incMap = {}, expMap = {};
        filtered.forEach(function(e) {
          const amt = parseFloat(e.amount) || 0;
          const cat = e.category || 'Uncategorized';
          if (e.type === 'income') { totalInc += amt; incMap[cat] = (incMap[cat] || 0) + amt; }
          else { totalExp += amt; expMap[cat] = (expMap[cat] || 0) + amt; }
        });

        const net = totalInc - totalExp;
        const savingsRate = totalInc > 0 ? (net / totalInc) * 100 : 0;
        const incKeys = Object.keys(incMap);
        const expKeys = Object.keys(expMap);
        const fmt = n => n.toLocaleString(undefined, { maximumFractionDigits: 0 });

        let html = '<div class="report-stats">' +
          '<div class="report-stat"><div class="lbl">Income</div>' +
            '<div class="val income">' + fmt(totalInc) + '</div></div>' +
          '<div class="report-stat"><div class="lbl">Expenses</div>' +
            '<div class="val expense">' + fmt(totalExp) + '</div></div>' +
          '<div class="report-stat"><div class="lbl">Net Savings</div>' +
            '<div class="val net">' + fmt(net) + '</div></div>' +
          '<div class="report-stat"><div class="lbl">Savings Rate</div>' +
            '<div class="val rate">' + savingsRate.toFixed(1) + '%</div></div>' +
        '</div>';

        html += '<div class="report-cat-list">';
        html += '<div class="report-cat-title">Income by Category</div>';
        if (incKeys.length === 0) {
          html += '<div style="color:var(--gray-400); font-style:italic; font-size:13px;">None</div>';
        } else {
          html += incKeys.map(c =>
            '<div class="report-cat-row"><span class="name">' + escapeHtml(c) + '</span>' +
            '<span class="amt income">' + fmt(incMap[c]) + '</span></div>'
          ).join('');
        }
        html += '<div class="report-cat-title" style="margin-top:14px;">Expenses by Category</div>';
        if (expKeys.length === 0) {
          html += '<div style="color:var(--gray-400); font-style:italic; font-size:13px;">None</div>';
        } else {
          html += expKeys.map(c =>
            '<div class="report-cat-row"><span class="name">' + escapeHtml(c) + '</span>' +
            '<span class="amt expense">' + fmt(expMap[c]) + '</span></div>'
          ).join('');
        }
        html += '</div>';

        html += '<div class="report-period">' +
          '<i class="far fa-calendar-alt"></i> ' + startDate + ' — ' + endDate +
        '</div>';

        container.innerHTML = html;
      }

      function sendReportViaEmail() {
        const entries = getEntries();
        if (entries.length === 0) { showToast('No transactions to report.', 'error'); return; }

        const now = new Date().toLocaleDateString();
        const days = getLastNDays(7);
        const startDate = days[0], endDate = days[days.length - 1];
        const filtered = entries.filter(e => e.date >= startDate && e.date <= endDate);

        let totalInc = 0, totalExp = 0;
        filtered.forEach(function(e) {
          const amt = parseFloat(e.amount) || 0;
          if (e.type === 'income') totalInc += amt; else totalExp += amt;
        });
        const net = totalInc - totalExp;
        const rate = totalInc > 0 ? (net / totalInc) * 100 : 0;

        let body = 'FinFit Weekly Financial Report\n';
        body += 'User: ' + currentUser + '\n';
        body += 'Generated: ' + now + '\n\n';
        body += 'Period: ' + startDate + ' - ' + endDate + '\n';
        body += 'Total Income: LKR ' + totalInc.toFixed(2) + '\n';
        body += 'Total Expenses: LKR ' + totalExp.toFixed(2) + '\n';
        body += 'Net Savings: LKR ' + net.toFixed(2) + '\n';
        body += 'Savings Rate: ' + rate.toFixed(1) + '%\n\n';
        body += '--- Transaction List (last 7 days) ---\n';
        filtered.forEach(function(e) {
          body += e.date + ' | ' + (e.type || '').toUpperCase() + ' | ' +
            e.category + ' | LKR ' + (parseFloat(e.amount) || 0).toFixed(2) +
            (e.reason && e.reason !== '—' ? ' | ' + e.reason : '') + '\n';
        });

        const subject = encodeURIComponent('FinFit Weekly Report – ' + currentUser);
        window.location.href = 'mailto:?subject=' + subject + '&body=' + encodeURIComponent(body);
        showToast('Email client opened.', 'success');
      }

      // ============================================================
      // COMPARE TAB
      // ============================================================
      let compareChart = null;

      function computeMonthTotals(ym) {
        const txns = txnsForMonth(ym);
        let inc = 0, exp = 0;
        txns.forEach(function(t) {
          const a = parseFloat(t.amount) || 0;
          if (t.type === 'income') inc += a; else exp += a;
        });
        const net = inc - exp;
        const rate = inc > 0 ? (net / inc) * 100 : 0;
        return { income: inc, expense: exp, net, rate, count: txns.length };
      }

      function renderCompare() {
        const sorted = months.slice().sort();
        const tip = document.getElementById('compareTip');
        const list = document.getElementById('compareList');
        const chartCard = document.querySelector('#tab-compare .card');

        if (sorted.length === 0) {
          if (tip) tip.textContent = 'No months';
          if (list) list.innerHTML =
            '<div class="empty-state"><i class="far fa-calendar"></i><p>Add a month to get started</p></div>';
          if (chartCard) chartCard.style.display = 'none';
          return;
        }

        const data = sorted.map(function(m) {
          const t = computeMonthTotals(m);
          return { month: m, income: t.income, expense: t.expense, net: t.net, rate: t.rate, count: t.count };
        });

        let bestIdx = -1, bestNet = -Infinity;
        data.forEach(function(d, i) {
          if (d.count > 0 && d.net > bestNet) { bestNet = d.net; bestIdx = i; }
        });

        if (tip) tip.textContent = sorted.length === 1
          ? 'Add more months'
          : sorted.length + ' months';

        // Render list
        const fmt = n => {
          const abs = Math.abs(n);
          if (abs >= 1e6) return (n / 1e6).toFixed(2) + 'M';
          if (abs >= 1e5) return (n / 1e3).toFixed(1) + 'k';
          return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
        };

        let html = '';
        data.forEach(function(d, i) {
          const isBest = i === bestIdx;
          const netCls = d.net >= 0 ? 'positive' : 'negative';
          html += '<div class="cmp-row' + (isBest ? ' best' : '') + '">' +
            '<div class="cmp-month">' +
              '<span class="dot"></span>' + formatMonth(d.month) +
              (isBest ? ' <i class="fas fa-crown cmp-crown"></i>' : '') +
            '</div>' +
            '<div class="cmp-right">' +
              '<div class="cmp-net ' + netCls + '">' +
                (d.net >= 0 ? '+' : '−') + ' ' + fmt(Math.abs(d.net)) +
              '</div>' +
              '<div class="cmp-sub">' +
                '<span class="in">+' + fmt(d.income) + '</span> · ' +
                '<span class="ex">−' + fmt(d.expense) + '</span> · ' +
                d.rate.toFixed(0) + '%' +
              '</div>' +
            '</div>' +
          '</div>';
        });
        if (list) list.innerHTML = html;

        // Render chart
        const canvas = document.getElementById('compareChart');
        if (!canvas) return;
        if (compareChart) { compareChart.destroy(); compareChart = null; }
        if (chartCard) chartCard.style.display = '';

        const labels = data.map(d => formatMonth(d.month));
        const incomeData = data.map(d => d.income);
        const expenseData = data.map(d => d.expense);

        compareChart = new Chart(canvas.getContext('2d'), {
          type: 'bar',
          data: {
            labels,
            datasets: [
              {
                label: 'Income',
                data: incomeData,
                backgroundColor: 'rgba(16,185,129,0.85)',
                hoverBackgroundColor: '#10b981',
                borderRadius: 6,
                borderSkipped: false
              },
              {
                label: 'Expenses',
                data: expenseData,
                backgroundColor: 'rgba(239,68,68,0.85)',
                hoverBackgroundColor: '#ef4444',
                borderRadius: 6,
                borderSkipped: false
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: { boxWidth: 10, padding: 12, font: { size: 11 }, color: '#64748b' }
              },
              tooltip: {
                callbacks: {
                  label: function(ctx) {
                    return ctx.dataset.label + ': ' +
                      (ctx.parsed.y || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                grid: { color: '#e2e8f0' },
                ticks: {
                  font: { size: 10 }, color: '#94a3b8',
                  callback: function(v) {
                    if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
                    if (v >= 1e3) return (v / 1e3).toFixed(0) + 'k';
                    return v;
                  }
                }
              },
              x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#94a3b8' } }
            }
          }
        });
      }

      // ============================================================
      // REFRESH
      // ============================================================
      function refreshEverything() {
        if (!currentUser) return;
        try {
          updateTxDateInput();
          renderMonthPills();
          renderMonthKPIs();
          renderTransactionList();
          renderLoans();
          generateWeeklyReport();
          renderCompare();
          updateGreeting();
        } catch (e) {
          console.error('❌ Refresh error:', e);
          showToast('Error updating dashboard.', 'error');
        }
      }

      // ============================================================
      // ADD MONTH
      // ============================================================
      function addMonthFromInput(value) {
        if (!value) return;
        if (!/^\d{4}-\d{2}$/.test(value)) {
          showToast('Please pick a valid month.', 'error');
          return;
        }
        if (months.indexOf(value) === -1) {
          months.push(value);
          months.sort();
          saveMonths();
          showToast('Added ' + formatMonth(value), 'success');
        } else {
          showToast('That month already exists.', 'error');
        }
        selectedMonth = value;
        saveSelectedMonth();
        refreshEverything();
      }

      // ============================================================
      // RESET
      // ============================================================
      function resetAllData() {
        if (!confirm('⚠️ Delete ALL your data on this device?\n\nThis removes transactions, months, and loans for "' + currentUser + '". Cannot be undone.')) return;
        Object.keys(KEY).forEach(function(k) {
          try { localStorage.removeItem(scoped(KEY[k])); } catch (e) {}
        });
        showToast('All data reset.', 'success');
        setTimeout(function() { location.reload(); }, 700);
      }

      // ============================================================
      // SHEET CONTROLS
      // ============================================================
      const sheetOverlay = document.getElementById('sheetOverlay');
      const txSheet = document.getElementById('txSheet');
      const loanSheet = document.getElementById('loanSheet');

      function openSheet(sheet) {
        if (!sheet) return;
        // close any open sheet first
        if (txSheet.classList.contains('open') && sheet !== txSheet) closeSheet(txSheet);
        if (loanSheet.classList.contains('open') && sheet !== loanSheet) closeSheet(loanSheet);

        sheet.classList.add('open');
        sheetOverlay.classList.add('show');
        document.body.style.overflow = 'hidden';
      }
      function closeSheet(sheet) {
        if (!sheet) return;
        sheet.classList.remove('open');
        if (!txSheet.classList.contains('open') && !loanSheet.classList.contains('open')) {
          sheetOverlay.classList.remove('show');
          document.body.style.overflow = '';
        }
      }
      sheetOverlay.addEventListener('click', function() {
        closeSheet(txSheet);
        closeSheet(loanSheet);
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closeSheet(txSheet);
          closeSheet(loanSheet);
        }
      });

      function openTxSheet() {
        updateTxDateInput();
        openSheet(txSheet);
        setTimeout(function() {
          const amt = document.getElementById('txAmount');
          if (amt) amt.focus();
        }, 340);
      }
      function openLoanSheet() {
        const d = document.getElementById('loanDate');
        if (d && !d.value) d.value = todayISO();
        openSheet(loanSheet);
        setTimeout(function() {
          const p = document.getElementById('loanPerson');
          if (p) p.focus();
        }, 340);
      }

      // ============================================================
      // TABS
      // ============================================================
      let currentTab = 'transactions';
      function switchTab(target) {
        currentTab = target;
        Array.prototype.forEach.call(document.querySelectorAll('.nav-btn'), function(b) {
          b.classList.toggle('active', b.getAttribute('data-tab') === target);
        });
        Array.prototype.forEach.call(document.querySelectorAll('.tab-content'), function(c) {
          c.classList.remove('active');
        });
        const panel = document.getElementById('tab-' + target);
        if (panel) panel.classList.add('active');

        const fab = document.getElementById('fabAdd');
        if (fab) fab.classList.toggle('visible', target === 'transactions');

        // Scroll main to top on tab switch
        const main = document.getElementById('appMain');
        if (main) main.scrollTop = 0;

        if (target === 'compare') setTimeout(renderCompare, 60);
        if (target === 'transactions') setTimeout(function() {
          renderTransactionList();
          renderLoans();
        }, 60);
      }

      // ============================================================
      // SETUP (once, after login)
      // ============================================================
      function setupApp() {
        // Nav buttons
        Array.prototype.forEach.call(document.querySelectorAll('.nav-btn'), function(b) {
          b.addEventListener('click', function() {
            switchTab(this.getAttribute('data-tab'));
          });
        });

        // FAB
        document.getElementById('fabAdd').addEventListener('click', openTxSheet);

        // Sheet close buttons
        document.getElementById('txSheetClose').addEventListener('click', () => closeSheet(txSheet));
        document.getElementById('loanSheetClose').addEventListener('click', () => closeSheet(loanSheet));

        // Segmented controls
        setupSegmented('txTypeSeg', 'txType', function() {
          populateCategories();
        });
        setupSegmented('loanTypeSeg', 'loanType');

        // Type change (fallback if hidden select changed directly)
        document.getElementById('txType').addEventListener('change', populateCategories);

        // Category change
        document.getElementById('txCategory').addEventListener('change', function() {
          toggleCustomCategory();
          if (this.value === 'Other') {
            const inp = document.getElementById('txCategoryCustom');
            setTimeout(() => inp.focus(), 30);
          }
        });
        document.getElementById('txCategoryCustom').addEventListener('keypress', function(e) {
          if (e.key === 'Enter') { e.preventDefault(); document.getElementById('txAmount').focus(); }
        });

        // Add transaction
        document.getElementById('addBtn').addEventListener('click', addTransaction);
        ['txAmount', 'txReason'].forEach(function(id) {
          const el = document.getElementById(id);
          if (el) el.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); addTransaction(); }
          });
        });

        // Add loan
        document.getElementById('openLoanSheetBtn').addEventListener('click', openLoanSheet);
        document.getElementById('addLoanBtn').addEventListener('click', addLoan);
        document.getElementById('loanPerson').addEventListener('keypress', function(e) {
          if (e.key === 'Enter') { e.preventDefault(); document.getElementById('loanAmount').focus(); }
        });
        document.getElementById('loanAmount').addEventListener('keypress', function(e) {
          if (e.key === 'Enter') { e.preventDefault(); addLoan(); }
        });
        document.getElementById('loanNotes').addEventListener('keypress', function(e) {
          if (e.key === 'Enter') { e.preventDefault(); addLoan(); }
        });

        // Report buttons
        document.getElementById('printReportBtn').addEventListener('click', function() { window.print(); });
        document.getElementById('emailReportBtn').addEventListener('click', sendReportViaEmail);

        // Month adder
        const newMonthInput = document.getElementById('newMonthInput');
        newMonthInput.addEventListener('change', function() {
          addMonthFromInput(this.value);
          this.value = '';
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', logout);

        // Collapsible sections
        Array.prototype.forEach.call(document.querySelectorAll('.collapse-btn'), function(btn) {
          btn.addEventListener('click', function() {
            const id = this.getAttribute('data-target');
            const body = document.getElementById(id);
            if (!body) return;
            const isOpen = body.classList.toggle('open');
            this.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            const icon = this.querySelector('i');
            if (icon) icon.className = isOpen ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
          });
        });

        // Resize re-render
        let resizeTimer;
        window.addEventListener('resize', function() {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function() {
            if (currentTab === 'compare') renderCompare();
          }, 220);
        });

        // Greeting ticker
        setInterval(updateGreeting, 60000);
      }

      function setupSegmented(segId, hiddenSelectId, onChange) {
        const seg = document.getElementById(segId);
        const hidden = document.getElementById(hiddenSelectId);
        if (!seg || !hidden) return;
        Array.prototype.forEach.call(seg.querySelectorAll('.seg-btn'), function(btn) {
          btn.addEventListener('click', function() {
            const val = this.getAttribute('data-value');
            Array.prototype.forEach.call(seg.querySelectorAll('.seg-btn'), b => b.classList.remove('active'));
            this.classList.add('active');
            hidden.value = val;
            if (typeof onChange === 'function') onChange(val);
          });
        });
      }

      // ============================================================
      // LOGIN SCREEN WIRING
      // ============================================================
      document.getElementById('loginForm').addEventListener('submit', handleLoginSubmit);

      document.getElementById('switchMode').addEventListener('click', function() {
        setLoginMode(loginMode === 'signin' ? 'signup' : 'signin');
        document.getElementById('loginUser').focus();
      });

      document.getElementById('pwToggle').addEventListener('click', function() {
        const input = document.getElementById('loginPass');
        const icon = this.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'far fa-eye-slash';
        } else {
          input.type = 'password';
          icon.className = 'far fa-eye';
        }
        input.focus();
      });

      // ============================================================
      // BOOT
      // ============================================================
      window.addEventListener('DOMContentLoaded', function() {
        // Ensure a default month exists even before login (harmless)
        const sessionUser = (function() {
          try { return localStorage.getItem(SESSION_KEY); } catch (e) { return null; }
        })();

        if (sessionUser) {
          const users = getUsers();
          if (users[sessionUser.toLowerCase()]) {
            startApp(users[sessionUser.toLowerCase()].username || sessionUser);
            return;
          }
          // stale session
          try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
        }

        // Show login
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appShell').style.display = 'none';
        setTimeout(function() {
          const u = document.getElementById('loginUser');
          if (u) u.focus();
        }, 200);
      });
    })();
  </script>
</body>
</html>
